name: Fork Release

# Fork-only workflow: builds darwin-arm64 and windows-amd64 from a tag
# and attaches them to a GitHub Release on this fork. The upstream
# workflow is replaced on this branch only — main keeps the original.

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: 1.25.x
  CGO_ENABLED: 1

jobs:
  release:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            os: macos-latest
            ext: ""
          - goos: windows
            goarch: amd64
            os: windows-latest
            ext: ".exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X main.Version=${{ steps.version.outputs.version }}" \
            -o "dist/claude-review-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/claude-review-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          generate_release_notes: true
          body: |
            Patched build of claude-review with absolute-path / `~/` support for `--file`.
            Source: PR https://github.com/Ch00k/claude-review/pull/20

            **Installation**:
            - macOS (Apple Silicon): download `claude-review-darwin-arm64`, `chmod +x`, ad-hoc sign with `codesign -s - claude-review-darwin-arm64`, and move into your PATH.
            - Windows: download `claude-review-windows-amd64.exe` and place into your PATH.
